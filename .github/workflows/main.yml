name: Build and Test
on: [push, pull_request]

env:
  GO_VERSION: 1.22.11

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check out source
        uses: actions/checkout@v4

      - name: Build
        run: make build

  test-cover:
    name: Unit coverage
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check out source
        uses: actions/checkout@v4

      - name: Test
        run: make unit-cover

      - name: Send top-level coverage
        uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          file: coverage.txt
          flag-name: obtcd
          format: 'golang'
          parallel: true

      - name: Send btcec
        uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          file: btcec/coverage.txt
          flag-name: btcec
          format: 'golang'
          parallel: true

      - name: Send btcutil coverage
        uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          file: btcutil/coverage.txt
          flag-name: btcutil
          format: 'golang'
          parallel: true

      - name: Send btcutil coverage for psbt package
        uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          file: btcutil/psbt/coverage.txt
          flag-name: btcutilpsbt
          format: 'golang'
          parallel: true
      
      - name: Notify coveralls all reports sent
        uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          parallel-finished: true

  test-race:
    name: Unit race
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check out source
        uses: actions/checkout@v4

      - name: Test
        run: make unit-race

  test-obtc:
    name: OBTC Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check out source
        uses: actions/checkout@v4

      - name: Run OBTC Network Tests
        run: |
          echo "Running OBTC-specific tests..."
          go test ./chaincfg ./wire -v -run "OBTC"

      - name: Run OBTC Fork Height Tests
        run: |
          echo "Running OBTC fork height tests..."
          go test ./chaincfg -v -run "Fork"

      - name: Validate OBTC Parameters
        run: |
          echo "Validating OBTC network parameters..."
          cat > validate_obtc.go << 'EOF'
          package main
          import (
            "fmt"
            "github.com/btcsuite/btcd/chaincfg"
          )
          func main() {
            // Verify OBTC networks are registered
            if !chaincfg.IsOBTC(&chaincfg.ObtcMainNetParams) {
              panic("OBTC MainNet not properly registered")
            }
            if !chaincfg.IsOBTC(&chaincfg.ObtcTestNetParams) {
              panic("OBTC TestNet not properly registered")
            }
            if !chaincfg.IsOBTC(&chaincfg.ObtcRegTestParams) {
              panic("OBTC RegTest not properly registered")
            }
            
            // Verify fork heights
            mainnetFork := chaincfg.GetOBTCForkHeight(&chaincfg.ObtcMainNetParams)
            testnetFork := chaincfg.GetOBTCForkHeight(&chaincfg.ObtcTestNetParams)
            regtestFork := chaincfg.GetOBTCForkHeight(&chaincfg.ObtcRegTestParams)
            
            if mainnetFork <= 0 || testnetFork <= 0 || regtestFork <= 0 {
              panic("Invalid fork heights detected")
            }
            
            fmt.Println("✅ All OBTC parameters validated successfully")
            fmt.Printf("Fork heights - MainNet: %d, TestNet: %d, RegTest: %d\n", 
              mainnetFork, testnetFork, regtestFork)
          }
          EOF
          go run validate_obtc.go

      - name: Check DevNet and Phase6 scripts
        run: |
          echo "Validating script entrypoints..."
          ls -la scripts/

          chmod +x \
            scripts/devnet-up.sh \
            scripts/phase6/run_testnet_node.sh \
            scripts/phase6/collect_validation_snapshot.sh \
            scripts/phase6/seed_preflight.sh \
            scripts/phase6/gen_testnet_conf.sh \
            scripts/validation/testnet_smoke.sh

          echo "Checking shell syntax..."
          bash -n scripts/devnet-up.sh
          bash -n scripts/phase6/run_testnet_node.sh
          bash -n scripts/phase6/collect_validation_snapshot.sh
          bash -n scripts/phase6/seed_preflight.sh
          bash -n scripts/phase6/gen_testnet_conf.sh
          bash -n scripts/validation/testnet_smoke.sh

          echo "Testing help outputs..."
          ./scripts/devnet-up.sh help
          ./scripts/phase6/run_testnet_node.sh --help
          ./scripts/phase6/collect_validation_snapshot.sh --help
          ./scripts/phase6/seed_preflight.sh --help
          ./scripts/phase6/gen_testnet_conf.sh --help
          ./scripts/validation/testnet_smoke.sh --help

          echo "✅ All scripts validated successfully"

  test-rpctest:
    name: RPC Integration (rpctest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check out source
        uses: actions/checkout@v4

      - name: Build btcd (for harness)
        run: go build -o btcd .

      - name: Run rpctest integration
        run: go test -p 1 -tags=rpctest ./integration/... -count=1 -v

  vet:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check out source
        uses: actions/checkout@v4

      - name: Go Vet
        run: go vet ./...

      - name: Go Fmt Check
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Code is not properly formatted. Run 'gofmt -s -w .'"
            gofmt -s -l .
            exit 1
          fi

  build-matrix:
    name: Build Matrix
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go-version: [1.22.11]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Check out source
        uses: actions/checkout@v4

      - name: Build OBTCD
        run: go build

      - name: Build btcctl
        run: |
          cd cmd/btcctl
          go build
