<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Organic Bitcoin (OBTC) Whitepaper V1</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
    <style>
      @page {
        size: A4;
        margin: 16mm 16mm 18mm;
      }

      :root {
        --bg: #f6f1e8;
        --paper: #fffdfa;
        --ink: #161915;
        --ink-soft: #45514b;
        --line: rgba(22, 25, 21, 0.1);
        --warm: #d95d1e;
        --warm-soft: rgba(217, 93, 30, 0.08);
        --cool: #246b5d;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--bg);
      }

      body {
        margin: 0;
        color: var(--ink);
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        line-height: 1.62;
        background:
          radial-gradient(circle at 12% 0%, rgba(217, 93, 30, 0.12), transparent 28%),
          radial-gradient(circle at 100% 10%, rgba(36, 107, 93, 0.1), transparent 24%),
          linear-gradient(180deg, #fbf8f3 0%, #f4ede3 100%);
      }

      .shell {
        width: min(900px, calc(100% - 48px));
        margin: 32px auto 40px;
        padding: 28px 30px 36px;
        border-radius: 28px;
        border: 1px solid var(--line);
        background: var(--paper);
        box-shadow: 0 18px 48px rgba(46, 31, 15, 0.1);
      }

      #content > * + * {
        margin-top: 1rem;
      }

      h1, h2, h3, h4 {
        margin: 1.8rem 0 0.8rem;
        color: var(--ink);
        letter-spacing: -0.03em;
        line-height: 1.08;
      }

      h1 {
        margin-top: 0;
        font-size: 2.35rem;
      }

      h2 {
        font-size: 1.45rem;
        padding-top: 0.35rem;
        border-top: 1px solid rgba(22, 25, 21, 0.08);
      }

      h3 {
        font-size: 1.12rem;
        color: var(--warm);
      }

      p, li, blockquote {
        color: var(--ink-soft);
      }

      strong {
        color: var(--ink);
      }

      a {
        color: var(--warm);
      }

      ul, ol {
        padding-left: 1.35rem;
      }

      li + li {
        margin-top: 0.35rem;
      }

      hr {
        border: 0;
        border-top: 1px solid rgba(22, 25, 21, 0.08);
        margin: 1.5rem 0;
      }

      blockquote {
        margin: 1.2rem 0;
        padding: 0.2rem 1rem;
        border-left: 3px solid rgba(217, 93, 30, 0.35);
        background: var(--warm-soft);
      }

      code {
        padding: 0.12rem 0.35rem;
        border-radius: 8px;
        background: rgba(22, 25, 21, 0.06);
        color: var(--warm);
        font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
        font-size: 0.94em;
      }

      pre {
        overflow-x: auto;
        padding: 0.95rem 1rem;
        border-radius: 18px;
        background: #141816;
        color: #f3f5f1;
      }

      pre code {
        padding: 0;
        background: transparent;
        color: inherit;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        border: 1px solid rgba(22, 25, 21, 0.08);
        border-radius: 18px;
        overflow: hidden;
        page-break-inside: avoid;
      }

      th, td {
        padding: 0.75rem 0.82rem;
        border-bottom: 1px solid rgba(22, 25, 21, 0.08);
        text-align: left;
        vertical-align: top;
        font-size: 0.95rem;
      }

      th {
        background: rgba(22, 25, 21, 0.05);
        color: var(--ink);
      }

      img {
        display: block;
        width: 100%;
        max-width: 100%;
        margin: 1rem 0;
        border-radius: 18px;
        border: 1px solid rgba(22, 25, 21, 0.08);
        box-shadow: 0 12px 28px rgba(46, 31, 15, 0.08);
        page-break-inside: avoid;
      }

      .ready-indicator {
        display: none;
      }

      @media print {
        body {
          background: #ffffff;
        }

        .shell {
          width: 100%;
          margin: 0;
          padding: 0;
          border: 0;
          border-radius: 0;
          box-shadow: none;
          background: transparent;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <article id="content">
        <p>Loading whitepaper...</p>
      </article>
      <div class="ready-indicator" id="ready">ready</div>
    </main>

    <script type="module">
      import { marked } from "https://cdn.jsdelivr.net/npm/marked/lib/marked.esm.js";
      import renderMathInElement from "https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.mjs";

      const content = document.getElementById("content");
      const ready = document.getElementById("ready");

      async function render() {
        try {
          const response = await fetch("./obtc_whitepaper_en_v1.md");
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const markdown = await response.text();
          content.innerHTML = marked.parse(markdown);
          renderMathInElement(content, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "\\(", right: "\\)", display: false },
              { left: "\\[", right: "\\]", display: true }
            ]
          });
          document.body.setAttribute("data-ready", "true");
          ready.textContent = "ready";
        } catch (error) {
          content.innerHTML = `
            <h1>Failed to render the whitepaper</h1>
            <p>${String(error)}</p>
          `;
          document.body.setAttribute("data-ready", "error");
        }
      }

      render();
    </script>
  </body>
</html>
