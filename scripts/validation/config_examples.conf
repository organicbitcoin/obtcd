# =============================================================================
# TROUBLESHOOTING
# =============================================================================

# Common Issues:
# 
# 1. "RPC connectivity test failed"
#    - Ensure obtcd is running with --expiryindex flag
#    - Check RPC credentials and host/port
#    - Verify TLS certificate path if using TLS
# 
# 2. "expiry index not available" 
#    - ExpiryIndex must be enabled with --expiryindex flag
#    - Wait for initial index build to complete
#    - Check obtcd logs for indexing progress
# 
# 3. "expiry index is disabled"
#    - Index may still be building - check getexpiryindexstats
#    - Ensure sufficient disk space for index
#    - Check for any errors in obtcd logs
# 
# 4. Performance issues
#    - Large height ranges may take time to process
#    - Reduce max_results for faster queries
#    - Consider using pagination for large datasets
# 
# 5. "parameter validation" failures
#    - Check that height ranges are valid
#    - Ensure max_results is within reasonable limits
#    - Verify network-specific height constraints
