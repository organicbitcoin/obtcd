# OBTC UTXO Expiry Index Validation Configuration
# This file provides sample configurations for testing the ExpiryIndex
# implementation across different networks.

# =============================================================================
# REGTEST CONFIGURATION (Local Development)
# =============================================================================
# Use this for local testing with regtest network
# Start obtcd with: ./obtcd --regtest --expiryindex --rpcuser=test --rpcpass=test

[regtest]
rpchost = "localhost:18334"
rpcuser = "test"
rpcpass = "test"
rpccert = ""  # Empty for regtest (no TLS)
network = "regtest"
start_height = 0  # Will use current tip - 1000
end_height = 0    # Will use current tip  
max_results = 100
verbose = true
output_file = "regtest_validation_report.json"
enable_stress = true
stress_iterations = 50
performance_bench = true

# =============================================================================
# TESTNET CONFIGURATION
# =============================================================================
# Use this for testing against Bitcoin testnet
# Start obtcd with: ./obtcd --testnet --expiryindex

[testnet]
rpchost = "localhost:18334"
rpcuser = "your_testnet_user"
rpcpass = "your_testnet_pass"
rpccert = "~/.obtcd/rpc.cert"
network = "testnet"
start_height = 2800000  # Recent testnet height
end_height = 0          # Current tip
max_results = 1000
verbose = true
output_file = "testnet_validation_report.json"
enable_stress = false
stress_iterations = 10
performance_bench = true

# =============================================================================
# MAINNET CONFIGURATION (Production Testing)
# =============================================================================
# Use this for testing against Bitcoin mainnet
# WARNING: Only use for read-only validation testing
# Start obtcd with: ./obtcd --expiryindex

[mainnet]
rpchost = "localhost:8334"
rpcuser = "your_mainnet_user"
rpcpass = "your_mainnet_pass"
rpccert = "~/.obtcd/rpc.cert"
network = "mainnet"
start_height = 860000   # Recent mainnet height
end_height = 0          # Current tip
max_results = 500
verbose = false
output_file = "mainnet_validation_report.json"
enable_stress = false
stress_iterations = 5
performance_bench = true

# =============================================================================
# USAGE EXAMPLES
# =============================================================================

# Example 1: Basic OBTC regtest validation
# go run utxo_expiry_validator.go -rpcuser=test -rpcpass=test -network=obtcregtest -verbose

# Example 2: OBTC testnet validation with custom range
# go run utxo_expiry_validator.go -rpcuser=user -rpcpass=pass -network=obtctestnet \
#   -start=2800000 -end=2810000 -max=1000 -output=testnet_results.json

# Example 3: Stress testing on OBTC regtest
# go run utxo_expiry_validator.go -rpcuser=test -rpcpass=test -network=obtcregtest \
#   -stress -stress-iterations=100 -bench -verbose

# Example 4: OBTC mainnet read-only validation
# go run utxo_expiry_validator.go -rpcuser=user -rpcpass=pass -network=obtcmainnet \
#   -start=860000 -end=861000 -max=100 -output=mainnet_validation.json

